
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💙 Eternal Love</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  overflow:hidden;
  background:radial-gradient(ellipse at center,#071d49 0%,#020714 65%,#000 100%);
  color:white;
  font-family:Arial,sans-serif;
}

canvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
}

#stars{z-index:0}
#art{z-index:1;pointer-events:none}

.screen{
  position:fixed;
  z-index:2;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  text-align:center;
  padding:16px;
  transition:opacity 1s,transform 1s;
}

#intro h1{
  color:#8bd5ff;
  font-size:clamp(30px,7vw,58px);
  text-shadow:0 0 25px #008cff,0 0 60px #0055ff;
}

#intro p{color:#a8d9ff;letter-spacing:3px;font-size:12px}

button{
  padding:14px 28px;
  margin:12px;
  border-radius:40px;
  border:1px solid #73caff;
  background:linear-gradient(135deg,#0753bd,#5427c8);
  color:white;
  font-size:15px;
  cursor:pointer;
  box-shadow:0 0 25px #087dff;
  transition:.3s;
}

button:hover{transform:scale(1.07);box-shadow:0 0 40px #168bff}

#result{opacity:0;pointer-events:none;transform:scale(.85)}
#result.show{opacity:1;pointer-events:auto;transform:scale(1)}
#intro.hide{opacity:0;pointer-events:none;transform:scale(1.15)}

#heartCanvas{
  position:relative;
  inset:auto;
  width:min(96vw,760px);
  height:min(68vh,610px);
  flex-shrink:0;
}

.caption{
  margin-top:-12px;
  color:#c6eaff;
  font-size:clamp(21px,5vw,36px);
  text-shadow:0 0 12px #008cff,0 0 35px #0066ff;
  animation:glow 2s ease-in-out infinite alternate;
}

.subtitle{
  color:#64baff;
  font-size:10px;
  letter-spacing:4px;
  margin-top:12px;
}

@keyframes glow{
  from{filter:brightness(.8)}
  to{filter:brightness(1.5)}
}

@media(max-height:650px){
  #heartCanvas{height:58vh}
  #result button{padding:9px 20px;margin:6px}
}
</style>
</head>

<body>
<canvas id="stars"></canvas>
<canvas id="art"></canvas>

<section class="screen" id="intro">
  <h1>💙 A Special Surprise</h1>
  <p>SOME FEELINGS ARE BEYOND WORDS</p>
  <button id="open">Open My Heart ✨</button>
</section>

<section class="screen" id="result">
  <canvas id="heartCanvas"></canvas>
  <div class="caption">I LOVE YOU 💙</div>
  <div class="subtitle">YOU ARE A BEAUTIFUL PART OF THIS UNIVERSE ∞</div>
  <button id="again">♥ Create Again</button>
</section>

<script>
const $=id=>document.getElementById(id);
const starCanvas=$("stars"), starCtx=starCanvas.getContext("2d");
const art=$("art"), artCtx=art.getContext("2d");
const heartCanvas=$("heartCanvas"), ctx=heartCanvas.getContext("2d");

let W=innerWidth,H=innerHeight,DPR=1;
let stars=[],sparkles=[],points=[];
let active=false,startedAt=0,raf=0,burstDone=false;

function resize(){
  W=innerWidth;H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);

  for(const c of [starCanvas,art]){
    c.width=Math.round(W*DPR);
    c.height=Math.round(H*DPR);
    c.getContext("2d").setTransform(DPR,0,0,DPR,0,0);
  }

  stars=Array.from({length:Math.min(220,Math.floor(W*H/3500))},()=>({
    x:Math.random()*W,y:Math.random()*H,
    r:Math.random()*1.6+.3,p:Math.random()*6.28,
    speed:.5+Math.random()*1.5
  }));
}
addEventListener("resize",resize);
resize();

function background(t){
  starCtx.clearRect(0,0,W,H);
  for(const s of stars){
    const a=.2+.8*Math.abs(Math.sin(t*.001*s.speed+s.p));
    starCtx.fillStyle=`rgba(100,185,255,${a})`;
    starCtx.beginPath();
    starCtx.arc(s.x,s.y,s.r,0,Math.PI*2);
    starCtx.fill();
  }
}

function heartPoint(t){
  return {
    x:16*Math.pow(Math.sin(t),3),
    y:-(13*Math.cos(t)-5*Math.cos(2*t)
      -2*Math.cos(3*t)-Math.cos(4*t))
  };
}

function makeHeart(){
  const r=heartCanvas.getBoundingClientRect();
  heartCanvas.width=Math.max(1,Math.round(r.width*DPR));
  heartCanvas.height=Math.max(1,Math.round(r.height*DPR));
  ctx.setTransform(DPR,0,0,DPR,0,0);

  const scale=Math.min(r.width/38,r.height/34);
  const cx=r.width/2,cy=r.height/2;
  points=[];

  // جمله‌ها روی مسیر قلب
  const N=1100;
  for(let i=0;i<N;i++){
    const t=i/N*Math.PI*2;
    const p=heartPoint(t);
    points.push({
      x:cx+p.x*scale,
      y:cy+p.y*scale,
      delay:i/N*1800,
      phase:Math.random()*6.28
    });
  }

  // ذرات درون قلب نیز از همان شکل پیروی می‌کنند
  for(let i=0;i<320;i++){
    const t=Math.random()*Math.PI*2;
    const p=heartPoint(t);
    const f=Math.sqrt(Math.random());
    sparkles.push({
      x:cx+p.x*scale*f,
      y:cy+p.y*scale*f,
      r:Math.random()*1.6+.4,
      phase:Math.random()*6.28
    });
  }
}

function drawHeart(t){
  const r=heartCanvas.getBoundingClientRect();
  ctx.clearRect(0,0,r.width,r.height);

  const elapsed=t-startedAt;
  const reveal=Math.min(1,elapsed/2300);
  const pulse=1+.022*Math.sin(elapsed*.004);
  const cx=r.width/2,cy=r.height/2;

  // درخشش مرکزی
  const glow=ctx.createRadialGradient(cx,cy,5,cx,cy,r.width*.43);
  glow.addColorStop(0,"rgba(0,100,255,.15)");
  glow.addColorStop(1,"rgba(0,30,100,0)");
  ctx.fillStyle=glow;
  ctx.fillRect(0,0,r.width,r.height);

  // ستاره‌های قلب
  for(const p of sparkles){
    const a=.2+.8*Math.abs(Math.sin(t*.002+p.phase));
    ctx.fillStyle=`rgba(80,180,255,${a})`;
    ctx.shadowColor="#168bff";
    ctx.shadowBlur=9;
    ctx.beginPath();
    ctx.arc(cx+(p.x-cx)*pulse,cy+(p.y-cy)*pulse,p.r,0,Math.PI*2);
    ctx.fill();
  }

  // تشکیل تدریجی قلب با جمله تکرارشونده
  ctx.font=`bold ${Math.max(7,Math.min(12,r.width/64))}px Arial`;
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.shadowColor="#168bff";
  ctx.shadowBlur=12;

  for(const p of points){
    const progress=Math.max(0,Math.min(1,(elapsed-p.delay)/300));
    if(progress<=0)continue;

    const x=cx+(p.x-cx)*pulse;
    const y=cy+(p.y-cy)*pulse;
    const shimmer=.75+.25*Math.sin(t*.004+p.phase);

    ctx.globalAlpha=progress*shimmer;
    ctx.fillStyle=progress>.8?"#d5f2ff":"#58b9ff";
    ctx.fillText("I LOVE YOU",x,y);
  }

  ctx.globalAlpha=1;
  ctx.shadowBlur=0;

  // جرقه‌های اطراف بعد از کامل‌شدن قلب
  if(elapsed>2500&&!burstDone){
    burstDone=true;
    createBurst(W/2,H/2,230);
  }
}

function createBurst(x,y,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2;
    const speed=1+Math.random()*5;
    sparkles.push({
      x:x+(Math.cos(a)*Math.random()*8),
      y:y+(Math.sin(a)*Math.random()*8),
      r:Math.random()*2+0.5,
      phase:Math.random()*6.28,
      vx:Math.cos(a)*speed,
      vy:Math.sin(a)*speed,
      life:70+Math.random()*60
    });
  }
  // جرقه‌ها بدون محدودیت انباشته نشوند
  if(sparkles.length>900)sparkles=sparkles.slice(-900);
}

function animate(t){
  background(t);
  artCtx.clearRect(0,0,W,H);

  // جرقه‌های متحرک تمام صفحه
  for(let i=sparkles.length-1;i>=0;i--){
    const p=sparkles[i];
    if(p.vx===undefined)continue;

    p.x+=p.vx;p.y+=p.vy;
    p.vx*=.985;p.vy*=.985;
    p.life--;

    artCtx.globalAlpha=Math.max(0,p.life/100);
    artCtx.fillStyle="#8ed8ff";
    artCtx.shadowColor="#168bff";
    artCtx.shadowBlur=15;
    artCtx.beginPath();
    artCtx.arc(p.x,p.y,p.r,0,Math.PI*2);
    artCtx.fill();

    if(p.life<=0)sparkles.splice(i,1);
  }
  artCtx.globalAlpha=1;
  artCtx.shadowBlur=0;

  if(active)drawHeart(t);
  raf=requestAnimationFrame(animate);
}
raf=requestAnimationFrame(animate);

function open(){
  $("intro").classList.add("hide");
  $("result").classList.add("show");

  setTimeout(()=>{
    sparkles=[];
    makeHeart();
    burstDone=false;
    startedAt=performance.now();
    active=true;
  },500);
}

$("open").addEventListener("click",open);

$("again").addEventListener("click",()=>{
  sparkles=[];
  makeHeart();
  burstDone=false;
  startedAt=performance.now();
  active=true;
});

</script>
</body>
</html>
